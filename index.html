
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Projeto educativo para leitura de QR Codes." />
  <title>Leitor de QR Code</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <main class="container">
    <header>
      <span class="tag">PROJETO EDUCACIONAL</span>
      <h1>Leitor de QR Code</h1>
      <p>Leia um código usando a câmera ou uma imagem.</p>
    </header>

    <section class="scanner-card">
      <div id="reader"></div>

      <div class="buttons">
        <button id="start-btn">Abrir câmera</button>
        <button id="stop-btn" class="secondary" disabled>
          Parar câmera
        </button>
      </div>

      <label for="file-input" class="upload">
        Ou selecione uma imagem com QR Code
      </label>
      <input id="file-input" type="file" accept="image/*" />

      <p id="status" role="status" aria-live="polite">
        Clique em "Abrir câmera" para começar.
      </p>
    </section>

    <section class="result-card">
      <h2>Resultado da leitura</h2>
      <div id="result">Nenhum QR Code lido ainda.</div>

      <div class="buttons">
        <button id="copy-btn" class="secondary" disabled>
          Copiar resultado
        </button>
        <button id="clear-btn" class="secondary">
          Limpar
        </button>
      </div>
    </section>

    <footer>
      Feito com HTML, CSS e JavaScript.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
